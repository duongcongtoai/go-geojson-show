<html>
    <head>
	<link rel="stylesheet" type="text/css" href="css/leaflet-1.9.4.css" />
	<link rel="stylesheet" type="text/css" href="css/MarkerCluster.Default.css" />		
	<link rel="stylesheet" type="text/css" href="css/show.css" />
    </head>
    <body>
	<div id="main">
	    <div id="map"></div>
	    <div id="sidebar">
	        <div id="controls">
	            <label style="cursor: pointer; display: block; margin-bottom: 10px; font-weight: bold;">
	                <input type="checkbox" id="toggle-overlap" checked>
	                Enable Overlapping Handling
	            </label>
	            <input type="text" id="feature-id" placeholder="ID (required for add/delete)" style="width: 100%; box-sizing: border-box; margin-bottom: 5px;">
	            <input type="text" id="feature-name" placeholder="Name" style="width: 100%; box-sizing: border-box; margin-bottom: 5px;">
	            <input type="text" id="feature-color" placeholder="Color (e.g. red, #ff0000)" style="width: 100%; box-sizing: border-box; margin-bottom: 5px;">
	            <textarea id="paste-geojson" rows="5" placeholder='Paste Feature GeoJSON here...'></textarea>
	            <div class="action-buttons">
	                <button id="add-geojson">Render</button>
	                <button id="delete-geojson">Delete by ID</button>
	            </div>
	        </div>
	        <div id="raw"></div>
	    </div>
	</div>
    </body>
    <script type="text/javascript" src="javascript/leaflet-1.9.4.js"></script>
    <script type="text/javascript" src="javascript/leaflet.polylineoffset.js"></script>
    <script type="text/javascript" src="javascript/esri-leaflet-3.0.19.js"></script>    
    <script type="text/javascript" src="javascript/leaflet.markercluster.js"></script>    
    <script type="text/javascript" src="javascript/protomaps-leaflet-5.1.0.js"></script>
    <script type="text/javascript" src="javascript/sfomuseum.golang.wasm.bundle.js"></script>
    <script type="text/javascript" src="javascript/whosonfirst.spelunker.geojson.js"></script>
    <script type="text/javascript" src="javascript/show.js"></script>
</html
